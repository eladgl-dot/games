<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<title>הרפתקת המילים - כיתה ב - צבעים וצורות</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg1: #1e40af; --bg2: #06b6d4;
  --ink: #2a1b5c; --good: #22c55e; --bad: #ef4444; --gold: #ffc414; --tile: #efe9ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 10px 10px 40px;
  font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); text-align: center;
  background: linear-gradient(160deg, var(--bg1), var(--bg2), #a78bfa, var(--bg1));
  background-size: 300% 300%; animation: bgmove 20s ease infinite;
}
body.girl { --bg1: #d6249f; --bg2: #ff9ac8; }
body.boy { --bg1: #1e40af; --bg2: #06b6d4; }
@keyframes bgmove { 0%,100% {background-position: 0% 50%} 50% {background-position: 100% 50%} }
.wrap { max-width: 460px; margin: 0 auto; }
.hidden { display: none !important; }
h1 { color: #fff; font-size: 1.6em; margin: 6px 0 8px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }

/* top bar */
#top { position: sticky; top: 0; z-index: 15; background: rgba(30,20,80,.55); backdrop-filter: blur(6px); border-radius: 18px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; margin-bottom: 6px; }
#who { display: inline-flex; background: rgba(255,255,255,.92); border-radius: 999px; padding: 3px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
#who button { margin: 0; padding: 5px 14px; font-size: .95em; background: transparent; color: var(--ink); box-shadow: none; }
#who button.on { background: #7c3aed; color: #fff; }
.chip { background: rgba(255,255,255,.93); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .95em; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.chip.pop { animation: pop .5s; }
@keyframes pop { 50% { transform: scale(1.3); } }
.chip.btn { cursor: pointer; border: 0; font-family: inherit; color: var(--ink); margin: 0; }

button {
  font-family: inherit; font-size: 1.1em; font-weight: 800; border: none; cursor: pointer;
  border-radius: 16px; padding: 10px 18px; margin: 5px; color: #fff;
  background: #7c3aed; box-shadow: 0 5px 0 #4c1d95; transition: transform .1s;
}
button:active { transform: translateY(4px); box-shadow: 0 1px 0 #4c1d95; }
button:disabled { opacity: .5; cursor: default; }
button.green { background: var(--good); box-shadow: 0 5px 0 #15803d; }
button.gold { background: var(--gold); color: #5a3d00; box-shadow: 0 5px 0 #c99700; }
button.grey { background: #94a3b8; box-shadow: 0 5px 0 #64748b; }
button.big { font-size: 1.3em; padding: 13px 30px; }

.card { background: #fff; border-radius: 26px; padding: 18px 12px 20px; box-shadow: 0 10px 0 rgba(0,0,0,.18), 0 18px 36px rgba(0,0,0,.2); }

/* ---------- 3D map ---------- */
.scene { perspective: 760px; perspective-origin: 50% 70%; padding: 10px 0 30px; margin-top: -170%; }
.plane {
  position: relative; width: 100%; aspect-ratio: 2 / 7.5;
  transform: rotateX(40deg); transform-origin: 50% 100%; transform-style: preserve-3d;
  border-radius: 40px; border: 6px solid #3f9d3f;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.18) 0 8%, transparent 9%),
    radial-gradient(circle at 80% 55%, rgba(255,255,255,.14) 0 10%, transparent 11%),
    linear-gradient(180deg, #8be28b, #4fbf5a 60%, #3da84a);
  box-shadow: 0 30px 0 #2d7a36, 0 40px 40px rgba(0,0,0,.35);
}
.plane svg { position: absolute; inset: 0; width: 100%; height: 100%; }
/* things stand upright on the ground: they pivot on their bottom edge so nothing sinks into the grass */
.upright { position: absolute; transform: translate3d(-50%, -100%, 2px) rotateX(-40deg); transform-origin: 50% 100%; }
.deco { line-height: 1; pointer-events: none; filter: drop-shadow(0 5px 2px rgba(0,0,0,.25)); }
.deco.sway { animation: sway 3s ease-in-out infinite alternate; }
@keyframes sway { from { transform: translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(-5deg); } to { transform: translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(5deg); } }
@keyframes bob { 0%,100% { transform: translate3d(-50%,-100%,2px) rotateX(-40deg); } 50% { transform: translate3d(-50%,-100%,2px) rotateX(-40deg) translateY(-9px); } }
@keyframes bosswig { 0%,100% { transform: translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(-6deg) scale(1); } 50% { transform: translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(6deg) scale(1.08); } }
.stand { display: flex; flex-direction: column; align-items: center; animation: bob 2s ease-in-out infinite; }
.stand.boss { animation: bosswig 1.6s ease-in-out infinite; }
.stand.locked { animation: none; }
.node {
  width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; margin: 0; padding: 0; cursor: pointer;
  font-size: 2em; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35);
  background: radial-gradient(circle at 35% 30%, #ffe08a, #ff9f1c);
  box-shadow: 0 9px 0 #b86a00, 0 16px 14px rgba(0,0,0,.3);
}
.node:active { transform: translateY(4px); }
.node.done { background: radial-gradient(circle at 35% 30%, #86efac, #16a34a); box-shadow: 0 9px 0 #0f6a30, 0 16px 14px rgba(0,0,0,.3); }
.node.cur { animation: ringglow 1.3s ease-out infinite; }
@keyframes ringglow { from { box-shadow: 0 9px 0 #b86a00, 0 16px 14px rgba(0,0,0,.3), 0 0 0 0 rgba(255,255,255,.95); } to { box-shadow: 0 9px 0 #b86a00, 0 16px 14px rgba(0,0,0,.3), 0 0 0 26px rgba(255,255,255,0); } }
.node.locked { width: 70px; height: 70px; background: none; border: 0; box-shadow: none; font-size: 3.4em; cursor: default; filter: drop-shadow(0 6px 3px rgba(0,0,0,.35)); }
.node.boss { width: 120px; height: 120px; background: none; border: 0; box-shadow: none; font-size: 5.4em; line-height: 1; filter: drop-shadow(0 8px 5px rgba(0,0,0,.4)); }
.node.boss.locked { font-size: 4em; }
.nstars { background: #fff; border-radius: 999px; padding: 0 10px; margin-bottom: 8px; font-size: 1.15em; line-height: 1.6; white-space: nowrap; box-shadow: 0 3px 0 rgba(0,0,0,.25); letter-spacing: 1px; }
.nstars b { color: #ffb800; } .nstars i { color: #d4d4d8; font-style: normal; }
.you { font-size: 2.6em; line-height: 1; margin-bottom: 4px; animation: hover 1.2s ease-in-out infinite; pointer-events: none; filter: drop-shadow(0 6px 3px rgba(0,0,0,.3)); }
@keyframes hover { 50% { transform: translateY(-10px); } }
#mapBtns { margin: 4px 0 0; position: relative; z-index: 6; }
#banner { position: relative; z-index: 6; }
#banner { margin-bottom: 8px; padding: 12px; font-weight: 700; }

/* ---------- stage ---------- */
#stage { position: relative; padding-top: 14px; }
#stageHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
#backMap { margin: 0; padding: 6px 14px; font-size: .95em; }
#dots { font-size: 1.9em; direction: ltr; letter-spacing: 2px; line-height: 1; }
#dots span { display: inline-block; color: #fff; text-shadow: 0 0 2px #7a6fa5, 0 0 2px #7a6fa5, 1px 1px 0 #7a6fa5, -1px -1px 0 #7a6fa5; }
#dots span.gold { color: #ffc414; text-shadow: 0 0 2px #b88400, 1px 1px 0 #c99700, -1px -1px 0 #c99700; }
#dots span.pop { animation: starpop .7s; }
#talk, #bossRow { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 0 8px; }
#pav { font-size: 4.2em; line-height: 1.1; filter: drop-shadow(0 6px 3px rgba(0,0,0,.2)); animation: idle 2.4s ease-in-out infinite; }
#pav.hop { animation: hop .6s; }
#pav.shake { animation: shake .4s; }
@keyframes idle { 50% { transform: translateY(-6px) rotate(-3deg); } }
@keyframes hop { 30% { transform: translateY(-30px) scale(1.2); } 60% { transform: translateY(0) scale(.95); } }
@keyframes shake { 25% {transform: translateX(-8px) rotate(-6deg)} 75% {transform: translateX(8px) rotate(6deg)} }
.bub { position: relative; background: #fff; border: 3px solid #7c3aed; border-radius: 20px; padding: 8px 14px; min-height: 2.4em; max-width: 240px; font-weight: 700; text-align: right; box-shadow: 0 4px 0 #cbbdf5; animation: bubin .3s; }
.bub::before { content: ""; position: absolute; right: -15px; top: 50%; margin-top: -11px; border: 11px solid transparent; border-left: 12px solid #7c3aed; border-right: 0; }
.bub::after { content: ""; position: absolute; right: -9px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-left: 9px solid #fff; border-right: 0; }
.bub.boss { border-color: #b3175f; box-shadow: 0 4px 0 #f5b8d6; background: #fff0f7; }
.bub.boss::before { border-left-color: #b3175f; } .bub.boss::after { border-left-color: #fff0f7; }
@keyframes bubin { from { transform: scale(.6); opacity: 0; } }
#boss { font-size: 4em; line-height: 1.1; animation: bossw 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 3px rgba(0,0,0,.25)); }
@keyframes bossw { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) scale(1.08); } }
#bossHp { font-size: 1.3em; margin-bottom: 4px; letter-spacing: 3px; }
#pemoji { font-size: 2.6em; }
#ptext { font-size: 2em; font-weight: 800; margin: 2px 0 10px; }
#word { direction: ltr; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; margin: 8px 0 12px; }
.part { display: flex; gap: 5px; }
.tile {
  width: var(--tw, 40px); height: calc(var(--tw, 40px) * 1.3); border-radius: 11px; padding: 0; min-width: 0; background: var(--tile); border: 3px solid #cbbdf5; box-shadow: 0 4px 0 #cbbdf5;
  font-size: calc(var(--tw, 40px) * .6); font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; color: var(--ink);
}
.tile.given { background: #fff; border-color: #ddd; box-shadow: 0 4px 0 #ddd; }
input.tile { padding: 0; font-family: inherit; outline: none; caret-color: transparent; }
input.tile:focus { border-color: #7c3aed; background: #fff; transform: translateY(-3px); box-shadow: 0 7px 0 #7c3aed; }
.tile.ok { background: var(--good); border-color: #15803d; box-shadow: 0 4px 0 #15803d; color: #fff; animation: jump .4s; }
.tile.hint { background: var(--gold); border-color: #d99a00; box-shadow: 0 4px 0 #d99a00; }
.tile.wrong { background: #ffd4d4; border-color: var(--bad); animation: tshake .35s; }
@keyframes tshake { 25% {transform: translateX(-6px)} 75% {transform: translateX(6px)} }
@keyframes jump { 50% { transform: translateY(-10px); } }
@media (max-width: 400px) { .tile { border-width: 2px; } }
#quiz { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 10px; }
#quiz button.optb { margin: 0; font-size: 1.2em; padding: 14px 6px; background: #efe9ff; color: var(--ink); box-shadow: 0 5px 0 #cbbdf5; }
#quiz button.optb.right { background: var(--good); color: #fff; box-shadow: 0 5px 0 #15803d; animation: jump .4s; }
#quiz button.optb.bad { background: #ffd4d4; color: #999; box-shadow: 0 5px 0 var(--bad); animation: tshake .35s; }
#msg { min-height: 1.8em; font-size: 1.2em; font-weight: 800; margin-top: 4px; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; background: rgba(20,10,60,.65); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 14px; overflow-y: auto; }
.modal { background: #fff; border-radius: 28px; padding: 20px 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 0 rgba(0,0,0,.2); animation: modalin .35s; }
@keyframes modalin { from { transform: scale(.7); opacity: 0; } }
.modal h2 { margin: 4px 0 8px; }
#eoAv { font-size: 4em; animation: idle 2s ease-in-out infinite; }
#eoStars { font-size: 3em; letter-spacing: 6px; direction: ltr; }
#eoStars span { display: inline-block; color: #cbbdf5; }
#eoStars span.lit { color: var(--gold); animation: starpop .7s; text-shadow: 0 3px 0 #c99700; }
@keyframes starpop { 0% { transform: scale(0) rotate(-180deg); } 60% { transform: scale(1.8) rotate(20deg); } 100% { transform: scale(1) rotate(0); } }
#eoTally { font-size: 1.3em; font-weight: 800; margin: 8px 0; }
#eoNote { min-height: 1.5em; font-weight: 700; }
.avgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
.avcard { background: #f3edff; border: 3px solid transparent; border-radius: 18px; padding: 8px 2px; font-size: 2.6em; cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 #cbbdf5; margin: 0; color: var(--ink); }
.avcard small { display: block; font-size: .3em; font-weight: 700; }
.avcard.sel { border-color: #7c3aed; background: #fff; }
.avcard.lock { opacity: .55; cursor: default; filter: grayscale(1); }
#party { position: fixed; inset: 0; z-index: 25; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  background: linear-gradient(120deg, #ff0080, #7928ca, #0070f3, #00dfd8, #ff0080); background-size: 400% 400%; animation: bgmove var(--bgs, 6s) linear infinite; }
#party::before { content: ""; position: absolute; inset: -60%; animation: spin var(--spin, 9s) linear infinite;
  background: conic-gradient(from 0deg, rgba(255,255,255,.35) 0 6deg, transparent 6deg 40deg, rgba(255,255,255,.3) 40deg 46deg, transparent 46deg 90deg, rgba(255,255,255,.35) 90deg 96deg, transparent 96deg 150deg, rgba(255,255,255,.3) 150deg 156deg, transparent 156deg 220deg, rgba(255,255,255,.35) 220deg 226deg, transparent 226deg 360deg); }
#party.crazy { animation: bgmove var(--bgs, 6s) linear infinite, hue 2.5s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
#partyNote { position: relative; max-width: 420px; background: rgba(0,0,0,.38); color: #fff; border-radius: 16px; padding: 8px 14px; margin-bottom: 12px; font-weight: 700; line-height: 1.5; }
@keyframes spin { to { transform: rotate(360deg); } }
#partyTitle { position: relative; color: #fff; font-size: 2.1em; font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,.3); animation: pop 1s infinite; margin-bottom: 10px; }
#pgrid { position: relative; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; max-width: 480px; }
.dancer { font-size: var(--dsz, 3.8em); line-height: 1.1; filter: drop-shadow(0 8px 4px rgba(0,0,0,.35)); animation: dance1 var(--dance, .55s) ease-in-out infinite alternate; }
.dancer:nth-child(3n+2) { animation-name: dance2; } .dancer:nth-child(3n) { animation-name: dance3; }
.dancer { position: relative; }
.fbub { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 150px; z-index: 4;
  background: #fff; color: var(--ink); border-radius: 14px; padding: 5px 10px; font-size: 13px; line-height: 1.3; font-weight: 700; text-align: center; filter: none; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.fbub::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
.dancer.say .fbub { display: block; animation: bubin .3s; }
@keyframes dance1 { to { transform: translateY(-26px) rotate(-10deg); } }
@keyframes dance2 { to { transform: translateY(-14px) rotate(12deg) scale(1.15); } }
@keyframes dance3 { from { transform: scale(.9) rotate(-14deg); } to { transform: translateY(-20px) scale(1.2) rotate(14deg); } }
.note { position: absolute; bottom: -50px; font-size: 2em; animation: rise 5s linear infinite; pointer-events: none; }
@keyframes rise { to { transform: translateY(-115vh) rotate(40deg); } }
#partyClose { position: relative; margin-top: 18px; }
#eoWin { margin-top: 10px; background: #fff8dc; border-radius: 18px; padding: 10px; font-weight: 700; }
canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div id="top">
    <div id="who"><button data-g="boy">👦 בן</button><button data-g="girl">👧 בת</button></div>
    <div class="chip" id="chipStars">⭐ <span id="tally">0</span>/<span id="maxStars">30</span></div>
    <div class="chip" id="chipNext"></div>
    <div class="chip" id="chipSkips">🤷 <span id="skipsLeft">2</span></div>
    <button class="chip btn" id="avBtn" title="החלף אווטאר">🐱</button>
    <button class="chip btn" id="partyTop" title="מסיבת חברים">🎉</button>
    <button class="chip btn" id="newBtn" title="הרפתקה חדשה">🔄</button>
  </div>
  <h1>🗺️ הרפתקת המילים</h1>

  <section class="card hidden" id="start">
    <h2 data-b="בחר חבר להרפתקה!" data-g="בחרי חבר להרפתקה!"></h2>
    <div class="avgrid" id="startGrid"></div>
    <p>כל 6 כוכבים תקבלו חבר חדש ✨</p>
  </section>

  <section class="hidden" id="map">
    <div id="banner" class="card hidden">
      🏆 כל הכבוד! סיימתם את ההרפתקה!<br>
      אפשר לחזור לשלבים ולאסוף עוד כוכבים, או להתחיל הרפתקה חדשה.<br>
      <button class="green" id="bannerNew">🆕 הרפתקה חדשה</button>
    </div>
    <div id="mapBtns"><button class="gold" id="partyBtn">🎉 מסיבת חברים</button> <button class="grey" id="siteBtn" onclick="location.href='../grade2/#english'">⬅ חזרה לאתר</button></div>
    <div class="scene"><div class="plane" id="plane"><svg id="road" viewBox="0 0 400 1500" preserveAspectRatio="none"></svg></div></div>
  </section>

  <section class="card hidden" id="stage">
    <div id="stageHead"><button class="grey" id="backMap">🗺️ למפה</button><div id="dots"></div></div>
    <div id="bossRow" class="hidden"><div id="boss">🐙</div><div class="bub boss" id="bossBubble"></div></div>
    <div id="bossHp" class="hidden"></div>
    <div id="talk"><div id="pav"></div><div class="bub" id="bubble"></div></div>
    <div id="pemoji"></div>
    <div id="ptext"></div>
    <div id="word"></div>
    <div id="quiz" class="hidden"></div>
    <div>
      <button class="gold" id="speakBtn">🔊 השמע</button>
      <button class="grey" id="skipBtn"></button>
      <button class="green hidden" id="nextQ">הבאה ➜</button>
    </div>
    <div id="msg"></div>
  </section>
</div>

<div class="ov hidden" id="endOv"><div class="modal">
  <div id="eoAv"></div>
  <h2 id="eoTitle"></h2>
  <div id="eoStars"><span>★</span><span>★</span><span>★</span></div>
  <div id="eoTally"></div>
  <div id="eoNote"></div>
  <div id="eoNew" class="hidden"></div>
  <div id="eoWin" class="hidden">
    🏆 כל הכבוד! סיימתם את כל השלבים וניצחתם את התמנון!<br>
    אפשר לחזור לשלבים ולאסוף עוד כוכבים, או להתחיל הרפתקה חדשה.<br>
    <button class="gold" id="winMap">🗺️ חזרה לשלבים</button>
    <button class="green" id="winNew">🆕 הרפתקה חדשה</button>
    <button id="winParty">🎉 מסיבה!</button>
  </div>
  <div id="eoBtns" class="hidden">
    <button class="grey" id="eoMap">🗺️ למפה</button>
    <button class="gold" id="eoAgain">🔁 עוד פעם</button>
    <button class="green" id="eoNext">שלב הבא ➜</button>
  </div>
</div></div>

<div class="ov hidden" id="avOv"><div class="modal">
  <h2 data-b="בחר חבר" data-g="בחרי חבר"></h2>
  <div class="avgrid" id="avGrid"></div>
  <button class="grey" id="avClose">סגור</button>
</div></div>

<div id="party" class="hidden">
  <div id="partyTitle">🎉 מסיבת חברים! 🎉</div>
  <div id="partyNote"></div>
  <div id="pgrid"></div>
  <button class="grey" id="partyClose">⏹ סגור</button>
</div>

<script>
// ============================================================
//  רשימת המילים של ההרפתקה  /  Word list for the adventure game
//
//  כדי להחליף מילים: ערכו את השורות למטה ושמרו, ואז רעננו את הדף.
//  To change words: edit the lines below, save, and refresh the page.
//
//  - מותר בין 8 ל-20 מילים (stages, stars and friends adjust by themselves)
//  - english = המילה באנגלית (אפשר גם שתי מילים, למשל "in fact")
//  - hebrew  = התרגום בעברית
//  - emoji   = אימוג'י שמתאים למילה (לא חובה; אם חסר יופיע 📝)
//  - כל שורה מסתיימת בפסיק, חוץ מהאחרונה
// ============================================================
window.WORDS = [
  { english: "red", hebrew: "אדום", emoji: "🔴" },
  { english: "blue", hebrew: "כחול", emoji: "🔵" },
  { english: "green", hebrew: "ירוק", emoji: "🟢" },
  { english: "yellow", hebrew: "צהוב", emoji: "🟡" },
  { english: "orange", hebrew: "כתום", emoji: "🟠" },
  { english: "purple", hebrew: "סגול", emoji: "🟣" },

      if (solved || b.disabled) return;

      else { mistakes++; sndBad(); b.classList.add("bad"); b.disabled = true; avatarReact("shake"); say(gt("אופס! נסה שוב 💪", "אופס! נסי שוב 💪")); if (st.boss) bossSay("חה חה, טעית! 😈"); }
    });

}
function buildLetters(level) {
  slots = [];
  const letters = word.english.replace(/ /g, "");
  const hide = level === "hard" ? letters.length - 1 : Math.round(letters.length * (level === "normal" ? 2 / 3 : 1 / 3));
  const pool = [...Array(letters.length).keys()].filter(i => level !== "hard" || i > 0);
  const hideSet = new Set(shuffle(pool).slice(0, hide));
  let n = 0;
  word.english.split(" ").forEach(part => {
    const p = document.createElement("div"); p.className = "part";
    for (const ch of part) {
      const hidden = hideSet.has(n);
      const t = document.createElement(hidden ? "input" : "div");
      t.classList.add("tile");
      const slot = { ch: ch.toLowerCase(), el: t, done: !hidden };
      if (!hidden) { t.classList.add("given"); t.textContent = ch; }
      else {
        t.type = "text"; t.maxLength = 2; t.autocomplete = "off"; t.autocapitalize = "none"; t.spellcheck = false;
        t.addEventListener("input", () => onType(slot));
        t.addEventListener("keydown", e => onKey(e, slot));
        t.addEventListener("focus", () => t.select());
      }
      slots.push(slot); p.appendChild(t); n++;
    }
    $("word").appendChild(p);
  });
  fitTiles();
  focusNext(-1);
  setTimeout(() => speak(), 300);
}
// shrink the tiles so the longest word part always fits inside the card
function fitTiles() {
  const box = $("word"), avail = box.clientWidth;
  if (!avail || !box.children.length) return;
  const longest = Math.max(...[...box.children].map(p => p.children.length));
  const size = Math.max(20, Math.min(40, Math.floor((avail - (longest - 1) * 5) / longest) - 6));
  box.style.setProperty("--tw", size + "px");
}
addEventListener("resize", fitTiles);
function focusNext(from) {

}
function onType(slot) {

  slot.el.value = "";
  if (!v || solved) return;
  const at = slots.indexOf(slot);
  if (v === slot.ch) {
    slot.done = true; slot.el.value = slot.ch.toUpperCase(); slot.el.readOnly = true; slot.el.classList.add("ok"); sndOk();
    if (slots.every(s => s.done)) done(mistakes === 0); else focusNext(at);
  } else {
    mistakes++; sndBad(); avatarReact("shake");
    slot.el.value = v.toUpperCase(); slot.el.classList.remove("wrong"); void slot.el.offsetWidth; slot.el.classList.add("wrong");
    setTimeout(() => { if (!slot.done) { slot.el.value = ""; slot.el.classList.remove("wrong"); } }, 450);
    say(gt("כמעט! נסה אות אחרת 💪", "כמעט! נסי אות אחרת 💪"));
    if (st.boss) bossSay("חה חה, טעית! 😈");
  }
}
function onKey(e, slot) {
  const at = slots.indexOf(slot);
  if (e.key === "Backspace" || e.key === "ArrowRight") {
    e.preventDefault();
    for (let k = at - 1; k >= 0; k--) if (!slots[k].done) { slots[k].el.focus(); break; }

}

  const a = $("pav"); a.classList.remove("hop", "shake"); void a.offsetWidth; a.classList.add(cls);
  setTimeout(() => a.classList.remove(cls), 700);
}
function done(star, skipped) {

  st.stars[st.q] = star ? 1 : 0;
  st.weak[st.q] = !star || !!skipped;
  $("pemoji").textContent = word.emoji;
  renderDots(star ? st.q : undefined); updateSkipBtn();
  if (star) {

    say(skipped ? gt("בסדר, עכשיו אתה יודע! ⭐", "בסדר, עכשיו את יודעת! ⭐") : gt(["וואו! קיבלת כוכב ⭐", "אלוף! עוד כוכב ⭐", "מדהים! כוכב ⭐"][st.q], ["וואו! קיבלת כוכב ⭐", "אלופה! עוד כוכב ⭐", "מדהים! כוכב ⭐"][st.q]));

}
$("skipBtn").addEventListener("click", () => {

$("speakBtn").addEventListener("click", () => { speak(); if (!solved) focusNext(-1); });

// ---------- end of stage ----------
function finishStage() {
  if (st.finished) return;   // a double-click on "finish" must not run it twice
  st.finished = true;
  const earned = st.stars.reduce((a, b) => a + b, 0);
  const prevBest = Math.max(0, S.best[st.s]), before = total();

  const after = total(), gained = after - before;
  const justFinished = !S.finished && S.best.every(b => b >= 0);
  if (justFinished) S.finished = true;
  reinsertWeak();
  save();
  const newAv = unlockedAv(after) > unlockedAv(before) ? AVATARS[unlockedAv(after) - 1] : null;

  $("eoAv").textContent = st.boss ? BOSS.e : S.avatar;
  $("eoTitle").textContent = st.boss
    ? (earned === 3 ? "ניצחת את תמנון המילים! 🏆" : earned > 0 ? "התמנון נחלש! 💪" : "התמנון ניצח הפעם...")

  const t0 = 600 + earned * 700 + 300;
  setTimeout(() => {
    const dur = 900, start = performance.now();
    (function tick(now) {

      if (p < 1) requestAnimationFrame(tick);

        $("eoNote").textContent = gained > 0 ? "+" + gained + (earned > prevBest && prevBest > 0 ? " · שיא חדש! 🏅" : "")
          : (prevBest > 0 ? "השיא שלך נשאר " + prevBest + "⭐" : "");

          const yes = document.createElement("button"); yes.className = "green"; yes.textContent = "שחק איתו!";

$("eoMap").addEventListener("click", () => { $("endOv").classList.add("hidden"); renderMap(); });

// ---------- friends party ----------

const SAYS = {

  "🐶": ["הב הב! איזה כיף! 🐾", "מכשכש בזנב מרוב שמחה! 🐕", "בואו נרוץ ונרקוד! 🦴", "הב! הב! עוד שיר! 🎵"],
  "🐼": ["יאמי, במבוק ומסיבה! 🎋", "פנדות יודעות לרקוד! 💃", "חיבוק קבוצתי! 🤗", "מתגלגלים מרוב שמחה! 🐼"],
  "🦊": ["ערמומי, אבל גם מתוק! 🦊✨", "בואו נעשה חיבוק קבוצתי! 🧡", "מי רוצה לרקוד איתי? 💃", "זנב מסתובב, מסיבה בשיא! 🌀"],
  "🐰": ["קפיץ קפיץ קפיץ! 🥕", "אוזניים למעלה, מסיבה בשיא! 🎉", "אוהב גזר ומסיבות! 🥕💕", "בום-בום-קפיצה! 🐇"],
  "🐯": ["גררררר! כיף ענק! 🐯", "פסים של שמחה! 🎊", "נמר של מסיבות! 😎", "רוואר! עוד מוזיקה! 🎸"],
  "🦄": ["נוצצים בכל מקום! ✨🌈", "קשת מעל הראש שלי! 🌈", "קסם של מסיבה! 🪄", "מפזר גליטר על כולם! 💖"],

function partyTick() {

function openParty() {
