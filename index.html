<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחקי לימוד</title>
<meta name="theme-color" content="#8e5cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --pink:#ff5fa2; --purple:#8e5cff; --blue:#35b6ff; --green:#2fd67b; --yellow:#ffd23f; --orange:#ff9140;
  --ink:#3a2a63; --card:#ffffffee;
  --font:"Varela Round","Arial Rounded MT Bold","Comic Sans MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);
  background:linear-gradient(160deg,var(--purple) 0%,var(--pink) 55%,var(--orange) 100%);background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0 0 6px;text-align:center;color:#fff;font-size:clamp(28px,6vw,44px);text-shadow:0 3px 0 rgba(58,42,99,.35)}
.sub{text-align:center;color:#fff;opacity:.95;margin:0 0 26px}
.grid{display:grid;gap:14px}
a.game{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:22px;background:var(--card);color:var(--ink);text-decoration:none;
  box-shadow:0 6px 0 rgba(58,42,99,.25);transition:transform .12s}
a.game:hover,a.game:focus-visible{transform:translateY(-3px);outline:3px solid var(--yellow)}
.icon{flex:none;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:32px;color:#fff}
.t{font-size:20px;font-weight:bold}
.d{font-size:14px;opacity:.8;margin-top:2px}
.new{margin-inline-start:auto;background:var(--green);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px}
.pill{display:inline-block;margin:0 0 18px;padding:8px 18px;border-radius:999px;background:#fff;color:var(--ink);font-weight:bold;text-decoration:none;box-shadow:0 4px 0 rgba(58,42,99,.3)}
.pill:hover,.pill:focus-visible{outline:3px solid var(--yellow)}
a.grade{justify-content:center;text-align:center;flex-direction:column;gap:6px;padding:28px 18px}
a.grade .big{font-size:56px;line-height:1}
a.grade .t{font-size:28px}
.install{display:block;margin:26px auto 0;border:0;border-radius:999px;background:var(--yellow);color:var(--ink);font:bold 18px var(--font);padding:12px 26px;box-shadow:0 5px 0 rgba(58,42,99,.35);cursor:pointer}
.install[hidden]{display:none}
.soon{opacity:.75}</style>
</head>
<body>
<main>
  <h1>🎮 משחקי לימוד</h1>
  <p class="sub">באיזו כיתה אתם?</p>
  <div class="grid">
      <a class="game grade" href="grade2/"><span class="big">🌈</span><span class="t">כיתה ב'</span><span class="d">אנגלית ועברית</span></a>
      <a class="game grade" href="grade6/"><span class="big">🚀</span><span class="t">כיתה ו'</span><span class="d">מתמטיקה, אנגלית ועברית</span></a>
  </div>
  <button class="install" id="installBtn" hidden>📲 התקנה</button>
</main>
<script src="pwa.js"></script>
</body>
</html>
