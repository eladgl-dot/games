<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרפתקת המדע</title>
<style>
:root{
  --pink:#ff5fa2; --purple:#8e5cff; --blue:#35b6ff; --green:#2fd67b; --yellow:#ffd23f; --orange:#ff9140; --red:#ff4d5e;
  --ink:#3a2a63; --card:#ffffffee;
  --font:"Varela Round","Arial Rounded MT Bold","Comic Sans MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none}
body{
  background:linear-gradient(135deg,#ffd1f0,#c9b8ff,#b8ecff,#d3ffd9);
  background-size:300% 300%;animation:bgmove 14s ease infinite;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.bg{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:34px;opacity:.4;animation:float 9s ease-in-out infinite}
.bg span.k2{animation-name:drift;animation-timing-function:linear}
.bg span.k3{animation-name:spin;animation-timing-function:linear}
.bg span.k4{animation-name:bounce;animation-timing-function:ease-in-out}
@keyframes drift{0%{transform:translateX(-30px) rotate(-10deg)}50%{transform:translateX(60px) rotate(10deg)}100%{transform:translateX(-30px) rotate(-10deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-50px) scale(1.15)}60%{transform:translateY(0) scale(.9)}}
.bg i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffffff22);border:2px solid #fff8;animation:rise 12s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
.mbtn:nth-child(odd){animation:wiggle 3.5s ease-in-out infinite}
.mbtn:nth-child(even){animation:wiggle 3.5s ease-in-out infinite reverse}
@keyframes wiggle{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) scale(1.02)}}
h1{animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) scale(1.03)}}
.card .phrase{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px #ff5fa2aa;transform:scale(1.04)}}
.chip{animation:bob 2.6s ease-in-out infinite}
.plus{animation:spin 4s linear infinite}
/* מסך הסבר */
#learn{overflow-y:auto;gap:12px;padding:2px 2px 12px}
.lsec{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 8px 0 #8e5cff22,0 12px 24px #8e5cff33;animation:slidein .5s backwards}
.lsec h2{margin:0 0 6px;font-size:23px;color:var(--purple);display:flex;align-items:center;gap:8px}
.lsec h2 .em{font-size:34px;display:inline-block;animation:bounce 2.2s infinite}
.lsec p{margin:6px 0;font-size:18px;line-height:1.5}
.ex{display:flex;align-items:center;gap:10px;background:#f6f0ff;border-radius:18px;padding:8px 12px;margin:8px 0;font-size:19px;line-height:1.4}
.ex .em{font-size:36px;flex:none;animation:float 3s ease-in-out infinite}
.ex b{color:var(--pink)}
.ex u{text-decoration-color:var(--blue);text-decoration-thickness:3px}
.ex.bad{background:#ffe9ec}
.ex.good{background:#e0ffee}
.tag{display:inline-block;border-radius:10px;padding:0 8px;color:#fff;font-weight:bold;font-size:16px}
.t1{background:var(--blue)}.t2{background:var(--pink)}
.arrow{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px)}}
.lgo{border:0;border-radius:99px;background:linear-gradient(135deg,#2fd67b,#19b062);color:#fff;font-size:22px;font-weight:bold;padding:14px;box-shadow:0 6px 0 #0003;animation:pulse .7s infinite alternate}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-28px) rotate(8deg)}}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 14px}
#top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-size:18px;font-weight:bold;box-shadow:0 4px 0 #0001,0 6px 14px #8e5cff33;display:flex;align-items:center;gap:6px}
#scorePill.fire{background:linear-gradient(90deg,#ffe259,#ff9140);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#combo{font-size:15px;color:var(--orange);min-width:44px;text-align:center}
.iconbtn{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;box-shadow:0 4px 0 #0001;cursor:pointer}
button{font-family:inherit;cursor:pointer;transition:transform .12s}
button:active:not(:disabled){transform:scale(.95)}
.screen{display:none;flex:1;flex-direction:column;min-height:0;animation:slidein .45s cubic-bezier(.2,.9,.3,1.2)}
.screen.on{display:flex}
@keyframes slidein{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
h1{margin:6px 0 2px;font-size:34px;text-align:center;color:var(--purple);text-shadow:0 3px 0 #fff}
.sub{text-align:center;margin:0 0 12px;font-size:17px}
.menu-grid{display:flex;flex-direction:column;gap:12px;overflow:auto;padding:4px 2px 8px}
.mbtn{border:0;border-radius:24px;padding:14px 16px;color:#fff;font-size:21px;font-weight:bold;display:flex;align-items:center;gap:14px;text-align:right;box-shadow:0 7px 0 #0003,0 12px 20px #0002}
.mbtn small{display:block;font-size:14px;font-weight:normal;opacity:.95}
.mbtn .em{font-size:40px;animation:float 4s ease-in-out infinite}
.m1{background:linear-gradient(135deg,#35b6ff,#2f7bff)}
.m2{background:linear-gradient(135deg,#ff5fa2,#ff3d7f)}
.m3{background:linear-gradient(135deg,#2fd67b,#19b062)}
.m5{background:linear-gradient(135deg,#8e5cff,#6a3df0)}
.m6{background:linear-gradient(135deg,#00c2c7,#0891b2)}
.m7{background:linear-gradient(135deg,#ff6bd6,#c13cff)}
.tfree{background:linear-gradient(135deg,#35b6ff,#2f7bff)}
.tcomp{background:linear-gradient(135deg,#ffb23f,#ff7a2f)}
.opt.small{font-size:20px;padding:12px 10px;line-height:1.3}
.card .q{font-size:24px;font-weight:bold;margin:8px 0;line-height:1.35}
.m4{background:linear-gradient(135deg,#ffb23f,#ff7a2f)}
#progress{height:12px;background:#fff9;border-radius:99px;overflow:hidden;margin:4px 0 6px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:99px;transition:width .4s}
#qinfo{text-align:center;font-size:15px;margin-bottom:6px}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0;position:relative}
.card{background:var(--card);border-radius:28px;padding:20px 14px;text-align:center;box-shadow:0 8px 0 #8e5cff22,0 14px 28px #8e5cff33;touch-action:pan-y}
.card .emoji{font-size:64px;line-height:1.1;display:block;animation:float 3.5s ease-in-out infinite}
.card .phrase{font-size:38px;font-weight:bold;margin-top:6px}
.card .ask{font-size:19px;margin-bottom:4px}
.chips{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0}
.chip{background:#f1e9ff;border-radius:16px;padding:8px 14px;font-size:26px;font-weight:bold}
.chip small{display:block;font-size:12px;font-weight:normal;opacity:.7}
.plus{font-size:26px;font-weight:bold;color:var(--pink)}
.swipehint{font-size:13px;opacity:.7;text-align:center}
.row{display:flex;gap:12px}
.big{flex:1;border:0;border-radius:22px;padding:18px 6px;font-size:21px;font-weight:bold;color:#fff;box-shadow:0 6px 0 #0003}
.yes{background:linear-gradient(135deg,#2fd67b,#19b062)}
.no{background:linear-gradient(135deg,#ff6b7a,#ff3d55)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:0;border-radius:20px;background:#fff;color:var(--ink);padding:14px 10px;font-size:27px;font-weight:bold;box-shadow:0 6px 0 #8e5cff33,0 8px 16px #0001;border:3px solid transparent}
.opt.right{background:#c8ffdf;border-color:var(--green);animation:pop .5s}
.opt.wrong{background:#ffd3d8;border-color:var(--red)}
.opt:disabled,.big:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.08)}}
#tip{display:none;background:#fff6c9;border:3px dashed var(--orange);border-radius:20px;padding:10px 12px;font-size:17px;text-align:center;animation:slidein .3s}
#tip.show{display:block}
#tip.good{background:#d8ffe8;border-color:var(--green)}
#next{display:none;border:0;border-radius:99px;background:var(--purple);color:#fff;font-size:20px;font-weight:bold;padding:12px 30px;align-self:center;box-shadow:0 5px 0 #0003}
#next.show{display:block}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
#flash{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--red);opacity:0;pointer-events:none;z-index:50}
#flash.on{animation:flash .45s}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.floatpts{position:fixed;z-index:60;font-size:34px;font-weight:bold;color:var(--green);text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:up 1s ease-out forwards}
.floatpts.bad{color:var(--red);font-size:44px}
@keyframes up{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-120px) scale(1.3)}}
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:70}
#end{align-items:center;justify-content:center;text-align:center;gap:8px}
#stars{font-size:62px;letter-spacing:6px}
#stars span{display:inline-block;animation:pop .7s backwards}
#endMsg{font-size:34px;font-weight:bold;color:var(--pink);text-shadow:0 3px 0 #fff}
.endbtns{display:flex;gap:12px;margin-top:14px;width:100%}
.endbtns .big{font-size:19px;padding:15px 4px}
.again{background:linear-gradient(135deg,#8e5cff,#5c7bff)}
.home{background:linear-gradient(135deg,#ff9140,#ff6a2f)}
@media (max-height:640px){.card .emoji{font-size:44px}.card .phrase{font-size:30px}.opt{font-size:22px;padding:10px 8px}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.f{display:inline}.m{display:none}
body.boy .m{display:inline}body.boy .f{display:none}
body.boy{background:linear-gradient(135deg,#bfe0ff,#8fb8ff,#9fe0ff,#c6f3ff);background-size:300% 300%}
.gtoggle{display:flex;background:#fff;border-radius:99px;padding:3px;box-shadow:0 4px 0 #0001}
.gtoggle button{border:0;background:transparent;border-radius:99px;width:38px;height:34px;font-size:20px;opacity:.55}
.gtoggle button.on{background:linear-gradient(135deg,#ffd1f0,#ff9ad0);opacity:1}
body.boy .gtoggle button.on{background:linear-gradient(135deg,#9fd0ff,#4f9bff)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto;padding:8px 2px 10px;align-content:start}
.tile{position:relative;border:0;border-radius:26px;padding:30px 6px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:0 7px 0 #0003,0 12px 20px #0002;animation:wiggle 3.6s ease-in-out infinite}
.tile:nth-child(even){animation-direction:reverse}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;padding:12px;font-size:20px}
.tile.wide .tt{text-align:right}
.tile .em{font-size:48px;line-height:1.1;animation:float 4s ease-in-out infinite}
.tile.wide .em{font-size:40px}
.tile b{font-size:19px;line-height:1.2}
.tile small{display:block;font-size:13px;opacity:.95;font-weight:normal}
.diff{position:absolute;top:8px;inset-inline-start:8px;background:#fff;color:var(--ink);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:bold}
.hotdiff{background:linear-gradient(90deg,#ffe259,#ff6a2f);color:#7a1d00;animation:pulse .6s infinite alternate}
.cnt{margin-top:4px;background:#0003;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:bold}
.tile.hot{box-shadow:0 7px 0 #0003,0 0 22px 4px #ff9140}
.c0{background:linear-gradient(135deg,#8e5cff,#6a3df0)}
.c1{background:linear-gradient(135deg,#35b6ff,#2f7bff)}
.c2{background:linear-gradient(135deg,#ff5fa2,#ff3d7f)}
.c3{background:linear-gradient(135deg,#2fd67b,#19b062)}
.c4{background:linear-gradient(135deg,#ffb23f,#ff7a2f)}
.c6{background:linear-gradient(135deg,#00c2c7,#0891b2)}
.c7{background:linear-gradient(135deg,#ff6bd6,#c13cff)}
/* ---- שאלות ---- */
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
.floatpts{direction:ltr}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15;font-weight:bold}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.mixed{display:inline-flex;align-items:center;gap:2px;direction:ltr;vertical-align:middle}
.math{font-size:34px;font-weight:bold;margin:6px 0;line-height:1.5}
.math.sm{font-size:26px}
.vis{display:flex;justify-content:center;margin:6px 0}
.vis svg{max-width:100%;max-height:190px;height:auto}
.qbox{display:inline-block;min-width:1.3em;border:3px dashed var(--purple);border-radius:10px;color:var(--purple);padding:0 4px}
pre.vert{direction:ltr;display:inline-block;text-align:left;margin:6px 0;font-family:Consolas,"Courier New",monospace;font-size:32px;font-weight:bold;line-height:1.2;background:#f6f0ff;border-radius:16px;padding:8px 18px}
.opts.inline{flex-direction:row}
.opts.inline .opt{flex:1;padding:14px 4px;font-size:34px}
.opt .fr{font-size:.95em}
#stage{overflow-y:auto;overflow-x:hidden;padding:4px 2px;justify-content:safe center}
.card .emoji{animation:none}
#ansbox{background:#fff;border:4px solid var(--purple);border-radius:20px;font-size:34px;font-weight:bold;padding:6px 14px;min-height:60px;direction:ltr;text-align:center;display:flex;justify-content:center;align-items:center;gap:8px}
#ansbox.right{border-color:var(--green);background:#c8ffdf}
#ansbox.wrong{border-color:var(--red);background:#ffd3d8}
#ansbox .cur{display:inline-block;width:3px;height:36px;background:var(--purple);animation:blink 1s steps(2) infinite}
#ansbox .unit{font-size:18px;direction:rtl;opacity:.7}
@keyframes blink{50%{opacity:0}}
#kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
#kp button{border:0;border-radius:16px;background:#fff;color:var(--ink);font-size:26px;font-weight:bold;padding:10px 0;box-shadow:0 5px 0 #8e5cff33}
#kp button.ok{grid-column:1/-1;background:linear-gradient(135deg,#2fd67b,#19b062);color:#fff;font-size:21px;box-shadow:0 5px 0 #0003}
#kp button.dl{background:#ffe3e6}
.topic{margin:6px 2px 2px;font-size:22px;font-weight:bold;color:var(--purple);display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 #fff}
.topic .tl{margin-inline-start:auto;border:0;border-radius:99px;background:#fff;color:var(--purple);font-weight:bold;font-size:15px;padding:5px 12px;box-shadow:0 4px 0 #8e5cff33}
#menu{overflow-y:auto}
#menu .tiles{overflow:visible;padding-top:10px}
.tile{padding:30px 6px 12px}
.tile b{font-size:17px}
.c5{background:linear-gradient(135deg,#ff9140,#ff6a2f)}
.c8{background:linear-gradient(135deg,#6a3df0,#35b6ff)}
.lsec .fr{font-size:1em}
.lsec svg{max-width:100%;height:auto}
.vis2{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
table.pt{border-collapse:collapse;margin:8px auto;direction:rtl;font-size:14px;max-width:100%;table-layout:fixed;width:100%}
table.pt td,table.pt th{border:2px solid #cdbcff;padding:4px 3px;text-align:center;word-break:break-word}
@media (max-width:400px){table.pt{font-size:12px}.math{font-size:26px}.math.sm{font-size:19px}pre.vert{font-size:26px}.gtoggle button{width:30px}.pill{padding:6px 10px}#combo{min-width:0}.opt{font-size:23px}}
table.pt th{background:#efe6ff}
#endList{width:100%;max-height:34vh;overflow-y:auto;text-align:right;font-size:16px;display:flex;flex-direction:column;gap:6px}
#endList .it{background:#fff;border-radius:14px;padding:8px 10px;border-inline-start:6px solid var(--red)}
#endList .it small{display:block;opacity:.8;margin-top:2px}
/* ================= הרפתקה ================= */
.hidden{display:none!important}
body.w0{background-image:linear-gradient(135deg,#d9d2ff,#b3a6ff,#fff0b8,#cfc6ff)}
body.w1{background-image:linear-gradient(135deg,#ffd1ec,#ffb3dd,#fff0b8,#ffc9ea)}
body.w2{background-image:linear-gradient(135deg,#ffe3bd,#ffc58a,#fff0b8,#ffd9a8)}
body.w4{background-image:linear-gradient(135deg,#bfe6ff,#8fd2ff,#ffe9c9,#c9ecff)}
body.w3{background-image:linear-gradient(135deg,#d3ffb8,#9be07a,#ffe9a0,#b8f0a0)}
.pill.pop,.iconbtn.pop{animation:pop .5s}
.iconbtn.av{font-size:22px}
#start h1,#home h1{font-size:28px}
#top .pill{padding:6px 12px}
#start,#home{overflow-y:auto}
.sub small{display:block;opacity:.8;margin-top:2px}
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.avcard{background:#f3edff;border:3px solid transparent;border-radius:18px;padding:8px 2px;font-size:42px;line-height:1.15;box-shadow:0 4px 0 #cbbdf5;margin:0;color:var(--ink);border-bottom-width:3px}
.avcard small{display:block;font-size:11px;font-weight:bold;line-height:1.2;padding:0 2px}
.avcard.sel{border-color:var(--purple);background:#fff}
.avcard.lock{opacity:.55;filter:grayscale(1)}
.avcard.boss{background:linear-gradient(135deg,#fff3c4,#ffe0f0)}
#startGrid{width:100%;max-width:420px;margin:10px auto}
#startGrid .avcard{font-size:62px;padding:14px 4px}
#startGrid .avcard small{font-size:14px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 2px 10px;align-content:start}
.wcard{position:relative;border:0;border-radius:26px;padding:16px 8px 12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 7px 0 #0003,0 12px 20px #0002;animation:wiggle 3.6s ease-in-out infinite}
.wcard:nth-child(even){animation-direction:reverse}
.wcard .wem{font-size:58px;line-height:1.1;animation:float 4s ease-in-out infinite}
.wcard b{font-size:20px;line-height:1.2}
.wcard small{font-size:14px;opacity:.95}
.wcard .wbar{width:84%;height:9px;background:#0003;border-radius:99px;overflow:hidden}
.wcard .wbar i{display:block;height:100%;background:#ffe259;border-radius:99px}
.wcard .wst{font-weight:bold;font-size:15px;direction:ltr}
#eoTally,#mapStars,#starPill{direction:ltr}
.wcard .wboss{font-size:13px;background:#fff;color:var(--ink);border-radius:99px;padding:2px 10px;font-weight:bold}
.wc0{background:linear-gradient(135deg,#8d7bff,#3a2bb0)}
.wc1{background:linear-gradient(135deg,#ff8fc8,#ff4fa3)}
.wc2{background:linear-gradient(135deg,#ffa95c,#e0651f)}
.wc3{background:linear-gradient(135deg,#4cd964,#1f9a46)}
.wc4{background:linear-gradient(135deg,#35c6ff,#1f6fe0);grid-column:1/3}
.homebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.tbtn{border:0;border-radius:99px;background:#fff;color:var(--ink);font-weight:bold;font-size:15px;padding:9px 14px;box-shadow:0 4px 0 #0002}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.pw{background:linear-gradient(135deg,#ffe259,#ff9140);color:#5a2a00}
.tbtn.gold{background:linear-gradient(135deg,#ffe259,#ffb23f);color:#5a3d00}
.tbtn.green{background:linear-gradient(135deg,#2fd67b,#19b062);color:#fff}
.tbtn.grey{background:#e4def5}
.tbtn.big2{font-size:19px;padding:12px 22px}
.opt.gone{opacity:.3;text-decoration:line-through}

/* ---- המפה התלת-ממדית ---- */
#map{overflow-y:auto;overflow-x:hidden;position:relative}
#mapHead{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0}
#mapTitle{font-size:16px;flex:1;min-width:0;text-align:center}
#mapBack{padding:8px 10px}
.scene{flex:none;perspective:760px;perspective-origin:50% 70%;padding:10px 0 30px;margin-top:-170%}
.plane{position:relative;width:100%;aspect-ratio:2/7.5;transform:rotateX(40deg);transform-origin:50% 100%;transform-style:preserve-3d;border-radius:40px;border:6px solid var(--pb,#3f9d3f);
  background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 8%,transparent 9%),radial-gradient(circle at 80% 55%,rgba(255,255,255,.14) 0 10%,transparent 11%),linear-gradient(180deg,var(--p1),var(--p2) 60%,var(--p3));
  box-shadow:0 30px 0 var(--ps,#2d7a36),0 40px 40px rgba(0,0,0,.35)}
.plane svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.upright{position:absolute;transform:translate3d(-50%,-100%,2px) rotateX(-40deg);transform-origin:50% 100%}
.deco{line-height:1;pointer-events:none;filter:drop-shadow(0 5px 2px rgba(0,0,0,.25))}
.deco.sway{animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(-5deg)}to{transform:translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(5deg)}}
@keyframes abob{0%,100%{transform:translate3d(-50%,-100%,2px) rotateX(-40deg)}50%{transform:translate3d(-50%,-100%,2px) rotateX(-40deg) translateY(-9px)}}
@keyframes bosswig{0%,100%{transform:translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(-6deg) scale(1)}50%{transform:translate3d(-50%,-100%,2px) rotateX(-40deg) rotate(6deg) scale(1.08)}}
.stand{display:flex;flex-direction:column;align-items:center;animation:abob 2s ease-in-out infinite}
.stand.boss{animation:bosswig 1.6s ease-in-out infinite}
.stand.locked{animation:none}
.node{width:80px;height:80px;border-radius:50%;border:4px solid #fff;margin:0;padding:0;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:radial-gradient(circle at 35% 30%,#ffe08a,#ff9f1c);box-shadow:0 9px 0 #b86a00,0 16px 14px rgba(0,0,0,.3)}
.node:active{transform:translateY(4px)}
.node.done{background:radial-gradient(circle at 35% 30%,#86efac,#16a34a);box-shadow:0 9px 0 #0f6a30,0 16px 14px rgba(0,0,0,.3)}
.node.cur{animation:ringglow 1.3s ease-out infinite}
@keyframes ringglow{from{box-shadow:0 9px 0 #b86a00,0 16px 14px rgba(0,0,0,.3),0 0 0 0 rgba(255,255,255,.95)}to{box-shadow:0 9px 0 #b86a00,0 16px 14px rgba(0,0,0,.3),0 0 0 26px rgba(255,255,255,0)}}
.node.locked{width:70px;height:70px;background:none;border:0;box-shadow:none;font-size:52px;cursor:default;filter:drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.node.boss{width:120px;height:120px;background:none;border:0;box-shadow:none;font-size:86px;line-height:1;filter:drop-shadow(0 8px 5px rgba(0,0,0,.4))}
.node.boss.locked{font-size:64px;filter:grayscale(.7) drop-shadow(0 6px 3px rgba(0,0,0,.35))}
.nstars{background:#fff;border-radius:999px;padding:0 10px;margin-bottom:8px;font-size:18px;line-height:1.6;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:1px;direction:ltr}
.nstars b{color:#ffb800}.nstars i{color:#d4d4d8;font-style:normal}
.you{font-size:42px;line-height:1;margin-bottom:4px;animation:hover 1.2s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 6px 3px rgba(0,0,0,.3))}
@keyframes hover{50%{transform:translateY(-10px)}}

/* ---- שלב ---- */
#qscreen{gap:6px}
#qhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
#dots{font-size:30px;direction:ltr;letter-spacing:2px;line-height:1}
#dots span{display:inline-block;color:#fff;text-shadow:0 0 2px #7a6fa5,0 0 2px #7a6fa5,1px 1px 0 #7a6fa5,-1px -1px 0 #7a6fa5}
#dots span.gold{color:#ffc414;text-shadow:0 0 2px #b88400,1px 1px 0 #c99700,-1px -1px 0 #c99700}
#dots span.miss{color:#d9d4ea}
#dots span.cur{transform:scale(1.2)}
#dots span.pop{animation:starpop .7s}
@keyframes starpop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.8) rotate(20deg)}100%{transform:scale(1) rotate(0)}}
#bossRow{display:flex;align-items:center;justify-content:center;gap:12px}
#bossCol{display:flex;flex-direction:column;align-items:center}
.bub.boss{border-color:#b3175f;background:#fff0f7;box-shadow:0 4px 0 #f5b8d6}
.bub.boss::before{border-left-color:#b3175f}.bub.boss::after{border-left-color:#fff0f7}
#boss{font-size:34px;line-height:1.1;animation:bossw 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 3px rgba(0,0,0,.25))}
@keyframes bossw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
#bossHp{font-size:16px;letter-spacing:2px;line-height:1}
#talk{display:flex;align-items:center;justify-content:center;gap:14px}
#pav{font-size:42px;line-height:1.1;filter:drop-shadow(0 6px 3px rgba(0,0,0,.2));animation:idle 2.4s ease-in-out infinite}
#pav.hop{animation:hop .6s}
#pav.shk{animation:pshake .4s}
@keyframes idle{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes hop{30%{transform:translateY(-22px) scale(1.2)}60%{transform:translateY(0) scale(.95)}}
@keyframes pshake{25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
.bub{position:relative;background:#fff;border:3px solid var(--purple);border-radius:18px;padding:6px 12px;min-height:2.2em;max-width:calc(100% - 70px);min-width:0;font-weight:bold;font-size:15px;line-height:1.3;text-align:right;box-shadow:0 4px 0 #cbbdf5;animation:bubin .3s;display:flex;align-items:center}
.bub::before{content:"";position:absolute;right:-15px;top:50%;margin-top:-11px;border:11px solid transparent;border-left:12px solid var(--purple);border-right:0}
.bub::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:9px solid #fff;border-right:0}
@keyframes bubin{from{transform:scale(.6);opacity:0}}
#qscreen .card{padding:12px 10px;gap:0}
#qscreen .card .emoji{font-size:34px!important}
#qscreen #kp{gap:6px}
#qscreen #kp button{padding:6px 0;font-size:22px}
#qscreen #kp button.ok{font-size:19px}
#qscreen #ansbox{min-height:50px;font-size:30px;padding:4px 12px}
#qscreen .opt{padding:11px 10px}
#qtools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:2px}
.gone{}
.opt.gone{pointer-events:none}

/* ---- חלונות ---- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,10,60,.65);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:#fff;border-radius:28px;padding:18px 14px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;box-shadow:0 10px 0 rgba(0,0,0,.2);text-align:center;animation:modalin .35s}
@keyframes modalin{from{transform:scale(.7);opacity:0}}
.modal h2{margin:4px 0 8px;color:var(--purple)}
.modal.wide{max-width:520px;text-align:right}
#eoAv{font-size:64px;animation:idle 2s ease-in-out infinite}
#eoStars{font-size:50px;letter-spacing:6px;direction:ltr}
#eoStars span{display:inline-block;color:#cbbdf5}
#eoStars span.lit{color:#ffc414;animation:starpop .7s;text-shadow:0 3px 0 #c99700}
#eoTally{font-size:21px;font-weight:bold;margin:8px 0}
#eoNote{min-height:1.5em;font-weight:bold}
.newf{background:#fff8dc;border-radius:18px;padding:10px;margin-top:8px;font-weight:bold;line-height:1.5}
.newf .bigem{font-size:52px}
.newf .pdesc{display:block;font-size:14px;color:#8a4b00}
#eoWin{margin-top:10px;background:#e0ffee;border-radius:18px;padding:10px;font-weight:bold}
.mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3a2a63;color:#fff;border-radius:16px;padding:10px 16px;z-index:80;font-weight:bold;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;font-size:15px}
#toast.on{opacity:1}

/* ---- מסיבה ---- */
#party{position:fixed;top:0;right:0;bottom:0;left:0;z-index:25;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(120deg,#ff0080,#7928ca,#0070f3,#00dfd8,#ff0080);background-size:400% 400%;animation:bgmove var(--bgs,6s) linear infinite}
#party::before{content:"";position:absolute;top:-60%;right:-60%;bottom:-60%;left:-60%;animation:spin var(--spin,9s) linear infinite;
  background:conic-gradient(from 0deg,rgba(255,255,255,.35) 0 6deg,transparent 6deg 40deg,rgba(255,255,255,.3) 40deg 46deg,transparent 46deg 90deg,rgba(255,255,255,.35) 90deg 96deg,transparent 96deg 150deg,rgba(255,255,255,.3) 150deg 156deg,transparent 156deg 220deg,rgba(255,255,255,.35) 220deg 226deg,transparent 226deg 360deg)}
#party.crazy{animation:bgmove var(--bgs,6s) linear infinite,hue 2.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#partyNote{position:relative;max-width:420px;background:rgba(0,0,0,.38);color:#fff;border-radius:16px;padding:8px 14px;margin-bottom:12px;font-weight:bold;line-height:1.5;text-align:center}
#partyTitle{position:relative;color:#fff;font-size:34px;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.3);animation:pop 1s infinite;margin-bottom:18px}
#pgrid{position:relative;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;max-width:480px}
.dancer{position:relative;font-size:var(--dsz,60px);line-height:1.1;filter:drop-shadow(0 8px 4px rgba(0,0,0,.35));animation:dance1 var(--dance,.55s) ease-in-out infinite alternate}
.dancer:nth-child(3n+2){animation-name:dance2}.dancer:nth-child(3n){animation-name:dance3}
.fbub{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:150px;z-index:4;background:#fff;color:var(--ink);border-radius:14px;padding:5px 10px;font-size:13px;line-height:1.3;font-weight:bold;text-align:center;filter:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.fbub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.dancer.say .fbub{display:block;animation:bubin .3s}
@keyframes dance1{to{transform:translateY(-26px) rotate(-10deg)}}
@keyframes dance2{to{transform:translateY(-14px) rotate(12deg) scale(1.15)}}
@keyframes dance3{from{transform:scale(.9) rotate(-14deg)}to{transform:translateY(-20px) scale(1.2) rotate(14deg)}}
.note{position:absolute;bottom:-50px;font-size:32px;animation:prise 5s linear infinite;pointer-events:none}
@keyframes prise{to{transform:translateY(-115vh) rotate(40deg)}}
#partyClose{position:relative;margin-top:18px}
@media (max-width:400px){.worlds{gap:9px}.wcard .wem{font-size:48px}.wcard b{font-size:18px}#top{gap:5px}.bub{font-size:14px}}

#qinfo{align-self:center;background:#fffc;border-radius:99px;padding:2px 14px}
.dancer.say{z-index:6}
.fbub.below{bottom:auto;top:100%}.fbub.below::after{display:none}
#mapHead .tbtn{padding:8px 10px}

#mapTitle small{display:block;font-size:13px;opacity:.75;font-weight:normal}

#mapTitle{display:block;line-height:1.2;border-radius:20px;padding:5px 10px}
#qtools{gap:6px}
#qtools .tbtn{padding:8px 11px;font-size:14px}

/* ---------- מדע: מיון ותרשים ---------- */
#stage{justify-content:flex-start;overflow-y:auto;padding:2px 2px 8px}
#stage .ask{font-size:19px;line-height:1.35}
.opts.two{flex-direction:row}.opts.two .opt{flex:1}
.pref{display:block;margin-top:4px;font-size:13px;opacity:.75}
#eoFact{background:#fff6c9;border-radius:14px;padding:8px 10px;font-size:14px;line-height:1.4;margin:8px 0;text-align:start}
.chip{border:0;border-radius:13px;background:#fff;color:var(--ink);font:bold 15px var(--font);padding:8px 10px;min-height:38px;line-height:1.2;box-shadow:0 3px 0 #8e5cff44;cursor:pointer;animation:none}
.chip.sel{outline:3px solid var(--pink);transform:translateY(-2px)}
.chip.ok{background:#c8ffdf}.chip.no{background:#ffd3d8}
.tray{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:flex-start;background:#ffffff88;border-radius:16px;padding:8px;min-height:52px}
.bins{display:grid;gap:8px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:1fr 1fr 1fr}
.bin{border:3px dashed var(--purple);background:#ffffffbb;border-radius:16px;padding:6px;min-height:104px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bin h3{margin:0;font-size:15px;text-align:center}
.binbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;flex:1}
.bins.n3 .chip{font-size:13px;padding:6px 7px}
.checkbtn{flex:none;border:0;border-radius:16px;background:linear-gradient(135deg,#2fd67b,#19b062);color:#fff;font:bold 18px var(--font);padding:10px;box-shadow:0 4px 0 #0f6a30;cursor:pointer}
.flow{display:flex;flex-direction:column;background:#ffffff88;border-radius:16px;padding:6px 8px}
.frow{display:flex;flex-direction:column;gap:2px}
.flabel{font-size:14px;font-weight:bold;text-align:start;line-height:1.2}
.flabel small{font-weight:normal}
.fhint{font-size:13px;font-weight:normal;opacity:.8;margin-top:2px}
.fsys{margin-bottom:3px}
.fslots{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.slot{flex:1 1 40%;min-width:0;min-height:40px;border:3px dashed var(--orange);background:#fff8ef;border-radius:12px;color:var(--ink);font:bold 14px var(--font);line-height:1.15;padding:3px 5px;cursor:pointer}
.slot.done{border-style:solid}.slot.ok{background:#c8ffdf;border-color:var(--green)}.slot.no{background:#ffd3d8;border-color:var(--red)}
.farrow{text-align:center;color:var(--orange);font-size:15px;line-height:1.1;font-weight:bold}
.fsys{display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#ffe9a8,#ffd0a0);border-radius:12px;padding:3px 8px;font-weight:bold;font-size:14px}
.fsys span{font-size:24px;line-height:1.1}
.chip:focus-visible,.slot:focus-visible,.bin:focus-visible,.checkbtn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.screen,#stage{scrollbar-width:none}
.screen::-webkit-scrollbar,#stage::-webkit-scrollbar{display:none}
/* מסך נמוך: שהכרטיסים והבדיקה ייכנסו בלי גלילה */
@media (max-height:740px){
  body.compactq #talk,body.compactq #qinfo,body.compactq #bossBubble{display:none}
  body.compactq #qscreen .card{padding:7px 10px}
  body.compactq #stage{gap:7px}
  body.compactq #stage .ask{font-size:16px;line-height:1.25}
  .slot{min-height:31px;font-size:13px;border-width:2px;padding:2px 4px}
  .fslots{gap:3px}
  .flow{padding:4px 6px}
  .farrow{font-size:11px;line-height:1}
  .fsys{padding:1px 8px;font-size:13px}.fsys span{font-size:18px}
  .chip{min-height:30px;padding:4px 8px;font-size:14px}
  .tray{padding:5px;gap:5px;min-height:40px}
  .bin{min-height:72px;padding:4px}
  .bin h3{font-size:14px}
  .checkbtn{padding:6px;font-size:16px}
  body.compactq #qtools .tbtn{padding:5px 11px}
}
/* הכפתורים בחלונות תמיד נראים, גם כשהתוכן ארוך */
#endOv .modal,#learnOv .modal{padding-bottom:0}
#eoBtns,#learnOv .mbtns{position:sticky;bottom:0;z-index:2;background:#fff;margin-top:8px;padding:8px 0 12px}
.modal{scrollbar-width:none}.modal::-webkit-scrollbar{display:none}
.lsec h2{font-family:var(--font)}
#qscreen .card{background:#fffffff5}
#stage .ask{font-weight:600}
#qtools{padding-bottom:6px}
@media (max-width:420px){#mapTitle small{display:none}#mapTitle{font-size:15px}}
@media (max-height:740px){
  #eoAv{font-size:42px;line-height:1.1}
  #eoStars{font-size:36px}
  .modal h2{font-size:20px;margin:2px 0 4px}
  .newf{padding:6px;line-height:1.3;font-size:14px}.newf .bigem{font-size:34px}
  #eoFact{font-size:13px;line-height:1.3;margin:5px 0}
  #eoBtns .tbtn{padding:7px 11px;font-size:14px}
}
.lsec h2 .em{animation:none}
@media (max-height:740px){
  .flabel{font-size:13px;line-height:1.1}
  .fhint{font-size:12px;margin-top:0}
  .slot{min-height:28px}
  .frow{gap:1px}
}
</style>

const SUBJECTS = ["נר", "קומקום", "פנס", "מאוורר", "מפרש", "שבשבת", "מכונית", "מדורה", "אופניים", "כוס", "מחשבון", "מערבל", "מיקרוגל", "טורבינה", "טורבינת", "טורבינות", "רמקול", "טוסטר", "מעבד מזון", "מכונת כביסה", "פחם", "נפט", "אורניום", "פופקורן", "מקלט", "מערכת שמע", "מערכת השמע", "מסחטה", "מסחטת", "מחשב"];

  const text = q.ask + " " + (q.right || "");

   ובו שאלות שטעו בהן באות ראשונות. stage: { ids, subs } של השלב הנוכחי */
function pickQuestion(pool, seen, weak, stage, rnd){
  rnd = rnd || Math.random;
  const ids = (stage && stage.ids) || [], subs = (stage && stage.subs) || [];
  let open = pool.filter(q => !seen.includes(q.id));
  if (!open.length){
    pool.forEach(x => { const i = seen.indexOf(x.id); if (i >= 0) seen.splice(i, 1); });
    open = pool.filter(q => !ids.includes(q.id));
    if (!open.length) open = pool;
  }
  const back = open.filter(q => weak.includes(q.id));
  let list = back.length ? back : open;
  const other = list.filter(q => !(q.subs || []).some(x => subs.includes(x)));
  if (other.length) list = other;
  const q = list[Math.floor(rnd() * list.length)];
  seen.push(q.id);
  return q;
}
/* בוחר עובדה שעוד לא הוצגה. בסוף הסיבוב מתחילים מחדש, אבל לא עם האחרונה שהוצגה */
function pickFact(n, seen, rnd){
  rnd = rnd || Math.random;
  let last = -1;
  if (seen.length >= n){ last = seen[seen.length - 1]; seen.length = 0; }
  const open = [];
  for (let i = 0; i < n; i++) if (!seen.includes(i) && i !== last) open.push(i);
  const f = open.length ? open[Math.floor(rnd() * open.length)] : 0;
  seen.push(f);
  return f;
}

function markResult(weak, id, clean){
  const i = weak.indexOf(id);
  if (clean){ if (i >= 0) weak.splice(i, 1); }
  else if (i < 0) weak.push(id);
}
/* placed: { טקסט: מפתח סל } */
function checkSort(items, placed){
  const marks = {};
  let done = true, ok = true;
  items.forEach(it => {
    if (!(it.h in placed)){ done = false; ok = false; return; }
    marks[it.h] = placed[it.h] === it.b;
    if (!marks[it.h]) ok = false;
  });
  return { done, ok, marks };
}
/* placed: מערך לכל קבוצה, בכל תא טקסט או null. בתוך קבוצה הסדר לא משנה */
function checkFlow(groups, placed){
  let done = true, ok = true;
  const marks = groups.map((g, i) => {
    const left = g.a.slice();
    return placed[i].map(v => {
      if (v === null || v === undefined){ done = false; ok = false; return false; }
      const j = left.indexOf(v);
      if (j < 0){ ok = false; return false; }
      left.splice(j, 1);
      return true;
    });
  });
  return { done, ok, marks };
}
/* עד n פריטים, לפחות אחד מכל סל */
function sampleSort(items, n, rnd){
  rnd = rnd || Math.random;
  const mixed = shuffle(items, rnd), out = [], bins = new Set();
  mixed.forEach(it => { if (!bins.has(it[1])){ bins.add(it[1]); out.push(it); } });
  mixed.forEach(it => { if (out.length < n && !out.includes(it)) out.push(it); });
  return shuffle(out, rnd);
}

  if (q.t === "flow") o.chips = shuffle(q.groups.flatMap(g => g.a).concat(q.decoys));

}

/* צליל */
let muted = false, actx = null;
try { muted = localStorage.getItem("sciMuted") === "1"; } catch(e){}
$("mute").textContent = muted ? "🔇" : "🔊";
function beep(freqs, dur){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
      t += dur * .8;
    });
  } catch(e){}
}
$("mute").onclick = () => {
  muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("sciMuted", muted ? "1" : "0"); } catch(e){}
};

/* קונפטי */
const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", sizeCv); sizeCv();
function confetti(n, x, y){
  const cols = ["#ff5fa2","#8e5cff","#35b6ff","#2fd67b","#ffd23f","#ff9140"];
  for (let i=0;i<n;i++) parts.push({
    x: x ?? cv.width/2, y: y ?? cv.height*.4,
    vx:(Math.random()-.5)*14, vy:-Math.random()*13-3, g:.35+Math.random()*.2,
    s:6+Math.random()*7, c:pick(cols), r:Math.random()*6, vr:(Math.random()-.5)*.4, life:90+Math.random()*50
  });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0,0,cv.width,cv.height);
}
/* החלקה: ימינה = האפשרות הראשונה (מימין), שמאלה = השנייה */
function attachSwipe(card, answer){
  let sx = null;
  card.addEventListener("pointerdown", e => { if (!locked){ sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; } });
  card.addEventListener("pointermove", e => {
    if (sx === null) return;
    const dx = e.clientX - sx;
    card.style.transform = "translateX(" + dx + "px) rotate(" + dx / 14 + "deg)";
    card.style.outline = dx > 40 ? "5px solid #2fd67b" : dx < -40 ? "5px solid #ff4d5e" : "none";
  });
  const end = (e, cancel) => {
    if (sx === null) return;
    const dx = cancel ? 0 : e.clientX - sx; sx = null;
    card.style.transition = "transform .25s"; card.style.transform = ""; card.style.outline = "none";
    if (Math.abs(dx) > 90) answer(dx > 0 ? 0 : 1);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", e => end(e, true));
}

function render(q, st){
  skipHook = sonarHook = null;
  document.body.classList.toggle("compactq", q.t === "sort" || q.t === "flow");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = (q.em ? '<span class="emoji" style="font-size:44px">' + q.em + '</span>' : '') + '<div class="ask">' + q.ask + '</div>';
  st.appendChild(card);
  const tip = tipBox();
  if (q.t === "sort") return renderSort(q, st, card, tip);
  if (q.t === "flow") return renderFlow(q, st, card, tip);
  const box = document.createElement("div");
  box.className = "opts" + (q.t === "yn" ? " two" : "");
  if (q.t === "yn"){
    const h = document.createElement("div"); h.className = "swipehint"; h.textContent = "אפשר גם להחליק את הכרטיס ימינה או שמאלה"; st.appendChild(h);
  }
  st.appendChild(box); st.appendChild(tip.t); st.appendChild(tip.n);
  const right = q.opts.find(o => o.ok).h;
  const btns = q.opts.map((o, i) => {
    const bt = document.createElement("button");
    bt.className = "opt small";
    bt.innerHTML = o.h; box.appendChild(bt);
    bt.onclick = () => choose(i);
    return bt;
  });
  function choose(i){
    if (locked || btns[i].disabled) return;
    if (!q.opts[i].ok){ btns[i].disabled = true; btns[i].classList.add("wrong"); onWrong(q, st); return; }
    btns.forEach((x, j) => { x.disabled = true; if (q.opts[j].ok) x.classList.add("right"); });
    result(true, q, st, tip, card, right);
  }
  if (q.t === "yn") attachSwipe(card, choose);
  skipHook = () => {
    if (locked) return;
    btns.forEach((x, j) => { x.disabled = true; if (q.opts[j].ok) x.classList.add("right"); });
    result(true, q, st, tip, card, right);
  };
  sonarHook = q.t === "yn" || q.opts.length < 3 ? null : () => {
    const w = btns.filter((x, j) => !q.opts[j].ok && !x.disabled);
    if (w.length < 2) return null;
    const x = pick(w); x.disabled = true; x.classList.add("gone");
    return "🦇 הסונאר הוריד תשובה אחת שגויה";
  };
}

/* ---------- כרטיסים שמניחים בהקשה: הקשה על כרטיס ואז על המקום שלו ---------- */
function makeChip(text){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = text;
  return b;
}
function checkBtn(onClick){
  const b = document.createElement("button");
  b.className = "checkbtn"; b.type = "button"; b.textContent = "✔ בדיקה"; b.onclick = onClick;
  return b;
}

/* ---------- שאלת מיון ---------- */
function renderSort(q, st, card, tip){
  card.insertAdjacentHTML("beforeend", '<div class="fhint">הקישו על כרטיס, ואז על המקום שלו</div>');
  const wrap = document.createElement("div"); wrap.className = "bins n" + q.bins.length;
  const tray = document.createElement("div"); tray.className = "tray";
  let sel = null;
  const clearMarks = () => st.querySelectorAll(".chip").forEach(c => c.classList.remove("ok", "no"));
  const select = c => {
    if (locked) return;
    if (sel) sel.classList.remove("sel");
    sel = sel === c ? null : c;
    if (sel) sel.classList.add("sel");
  };
  const place = (c, box) => { box.appendChild(c); c.classList.remove("sel", "ok", "no"); if (sel === c) sel = null; };
  const bins = q.bins.map(b => {
    const el = document.createElement("div"); el.className = "bin"; el.setAttribute("role", "button"); el.tabIndex = 0;
    el.innerHTML = '<h3>' + b.h + '</h3><div class="binbox"></div>';
    el.onclick = () => { if (!locked && sel) place(sel, el.lastChild); };
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); el.onclick(); } };
    wrap.appendChild(el);
    return { k: b.k, box: el.lastChild };
  });
  const chips = q.show.map(it => {
    const c = makeChip(it.h);
    c.onclick = e => { e.stopPropagation(); select(c); };
    tray.appendChild(c);
    return { c, it };
  });
  tray.onclick = () => { if (!locked && sel && sel.parentNode !== tray) place(sel, tray); };
  const read = () => {
    const placed = {};
    bins.forEach(b => [...b.box.children].forEach(c => { placed[c.textContent] = b.k; }));
    return placed;
  };
  const paint = marks => chips.forEach(({ c, it }) => { if (it.h in marks){ c.classList.toggle("ok", marks[it.h]); c.classList.toggle("no", !marks[it.h]); } });
  const finish = (chk) => {
    locked = true; chk.style.display = "none"; tray.style.display = "none";
    result(true, q, st, tip, card, "מסומנת למעלה");
  };
  const chk = checkBtn(() => {
    if (locked) return;
    const r = checkSort(q.show, read());
    if (!r.done){ toast("קודם מניחים את כל הכרטיסים 🙂"); return; }
    paint(r.marks);
    if (!r.ok){ onWrong(q, st); return; }
    finish(chk);
  });
  st.append(wrap, tray, chk, tip.t, tip.n);
  const binOf = k => bins.find(b => b.k === k).box;
  skipHook = () => {
    if (locked) return;
    clearMarks();
    chips.forEach(({ c, it }) => place(c, binOf(it.b)));
    paint(checkSort(q.show, read()).marks);
    finish(chk);
  };
  sonarHook = () => {
    const placed = read(), miss = chips.find(({ c, it }) => placed[it.h] !== it.b);
    if (!miss) return null;
    place(miss.c, binOf(miss.it.b)); miss.c.classList.add("ok");
    return "🦇 הסונאר הציב כרטיס אחד במקום הנכון";
  };
}

/* ---------- שאלת תרשים ---------- */
function renderFlow(q, st, card, tip){
  card.insertAdjacentHTML("beforeend", '<div class="fhint">הקישו על כרטיס למטה, ואז על הריבוע שלו</div>');
  const wrap = document.createElement("div"); wrap.className = "flow";
  const tray = document.createElement("div"); tray.className = "tray";
  let sel = null;
  const select = c => {
    if (locked) return;
    if (sel) sel.classList.remove("sel");
    sel = sel === c ? null : c;
    if (sel) sel.classList.add("sel");
  };
  const chips = q.chips.map(t => {
    const c = makeChip(t);
    c.onclick = e => { e.stopPropagation(); select(c); };
    tray.appendChild(c);
    return c;
  });
  const free = slot => {
    const c = slot._chip;
    if (!c) return;
    c.classList.remove("ok", "no"); c.style.display = ""; slot._chip = null;
    slot.textContent = "?"; slot.classList.remove("done", "ok", "no");
  };
  const fill = (slot, c) => {
    free(slot);
    slot._chip = c; slot.textContent = c.textContent; slot.classList.add("done");
    c.classList.remove("sel"); c.style.display = "none";
    if (sel === c) sel = null;
  };
  const sysHtml = q.sys ? '<div class="fsys"><span>' + q.sys.em + '</span>' + q.sys.n + '</div>' : "";
  if (q.sys && q.sys.top) wrap.insertAdjacentHTML("beforeend", sysHtml);
  const slots = q.groups.map((g, gi) => {
    if (gi > 0) wrap.insertAdjacentHTML("beforeend", '<div class="farrow">⬇</div>');
    const row = document.createElement("div"); row.className = "frow";
    row.innerHTML = '<div class="flabel">' + g.l + (g.a.length > 1 ? " <small>(בחרו " + g.a.length + ")</small>" : "") + '</div>';
    const box = document.createElement("div"); box.className = "fslots";
    const list = g.a.map(() => {
      const s = document.createElement("button"); s.className = "slot"; s.type = "button"; s.textContent = "?";
      s.onclick = () => { if (locked) return; if (sel) fill(s, sel); else free(s); };
      box.appendChild(s);
      return s;
    });
    row.appendChild(box); wrap.appendChild(row);
    if (gi === 0 && q.sys && !q.sys.top) wrap.insertAdjacentHTML("beforeend", '<div class="farrow">⬇</div>' + sysHtml);
    return list;
  });
  const read = () => slots.map(l => l.map(s => s._chip ? s._chip.textContent : null));
  const paint = marks => slots.forEach((l, i) => l.forEach((s, j) => { s.classList.toggle("ok", marks[i][j]); s.classList.toggle("no", !marks[i][j]); }));
  const finish = chk => {
    locked = true; chk.style.display = "none"; tray.style.display = "none";
    result(true, q, st, tip, card, "מסומנת למעלה");
  };
  const chk = checkBtn(() => {
    if (locked) return;
    const r = checkFlow(q.groups, read());
    if (!r.done){ toast("קודם ממלאים את כל הריבועים 🙂"); return; }
    paint(r.marks);
    if (!r.ok){ onWrong(q, st); return; }
    finish(chk);
  });
  st.append(wrap, tray, chk, tip.t, tip.n);
  const takeChip = text => chips.find(c => c.textContent === text && c.style.display !== "none") || null;
  skipHook = () => {
    if (locked) return;
    slots.flat().forEach(free);
    q.groups.forEach((g, i) => g.a.forEach((a, j) => fill(slots[i][j], takeChip(a))));
    paint(checkFlow(q.groups, read()).marks);
    finish(chk);
  };
  sonarHook = () => {
    const marks = checkFlow(q.groups, read()).marks;
    for (let i = 0; i < slots.length; i++) for (let j = 0; j < slots[i].length; j++){
      if (marks[i][j]) continue;
      const have = slots[i].filter((_, k) => marks[i][k]).map(s => s._chip.textContent), need = q.groups[i].a.slice();
      have.forEach(h => need.splice(need.indexOf(h), 1));
      let c = takeChip(need[0]);
      if (!c){
        const holder = slots.flat().find(s => s._chip && s._chip.textContent === need[0] && s !== slots[i][j]);
        if (!holder) return null;
        free(holder); c = takeChip(need[0]);
      }
      fill(slots[i][j], c); slots[i][j].classList.add("ok");
      return "🦇 הסונאר מילא ריבוע אחד נכון";
    }
    return null;
  };
}

/* ---------- המפה התלת-ממדית של כל עולם ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function curvePath(pts){

    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += " C" + (p1[0] + (p2[0] - p0[0]) / 6) + "," + (p1[1] + (p2[1] - p0[1]) / 6) + " " + (p2[0] - (p3[0] - p1[0]) / 6) + "," + (p2[1] - (p3[1] - p1[1]) / 6) + " " + p2[0] + "," + p2[1];

}
let N = 6, VH = 900, K = 9, NODE_Y = [], NODE_X = [];
function setGeom(n){
  N = n; VH = 150 * N; K = VH / 100;

  const r = rng(5);
  NODE_X = Array.from({ length: N }, (_, i) => i === N - 1 ? 50 : Math.round(Math.max(16, Math.min(84, 50 + 30 * Math.sin(i * 1.05 + .6) + (r() - .5) * 14))));
}
function drawRoad(w){
  const r = rng(11), pts = [[200, VH]];
  NODE_X.forEach((x, i) => {
    const p = [x * 4, NODE_Y[i] * K];
    if (i > 0){ const q = pts[pts.length - 1]; pts.push([Math.max(50, Math.min(350, (q[0] + p[0]) / 2 + (r() - .5) * 110)), (q[1] + p[1]) / 2 + (r() - .5) * 24]); }
    pts.push(p);

    '<path d="' + d + '" fill="none" stroke="' + c[1] + '" stroke-width="64" stroke-linecap="round"/>' +
    '<path d="' + d + '" fill="none" stroke="' + c[2] + '" stroke-width="46" stroke-linecap="round"/>' +
    '<path d="' + d + '" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round"/>' +
    NODE_X.map((x, i) => '<ellipse cx="' + x * 4 + '" cy="' + NODE_Y[i] * K + '" rx="42" ry="15" fill="rgba(0,0,0,.3)"/>').join("");

}

        const yes = document.createElement("button"); yes.className = "tbtn green"; yes.textContent = gt("שחק איתו!", "שחקי איתו!");
        yes.onclick = () => { S.avatar = f.e; save(); updateTop(); yes.remove(); };
        d.appendChild(yes); $("eoNew").appendChild(d);
        confetti(200); beep([523, 659, 784, 1047], .15);
      });
      if (justWon){ $("eoWin").classList.remove("hidden"); confetti(300); setTimeout(() => confetti(300), 700); }
      $("eoBtns").classList.remove("hidden");
    })(t0);
  }, 600 + earned * 700 + 300);
}

/* ===================== מסיבת החברים ===================== */
const MEL = [523, 0, 659, 784, 0, 659, 587, 0, 523, 659, 784, 1046, 784, 659, 587, 0];
const BASS = [131, 0, 131, 0, 196, 0, 196, 0, 175, 0, 175, 0, 196, 0, 196, 0];
const ARP = [523, 659, 784, 1046];
let partyTimer = null, partyFx = null, partyMoveT = null, partySayT = null, partyStep = 0, partyLvl = 0;
function partyTick(){
  const i = partyStep++ % 16, n = partyLvl + 3;
  if (MEL[i]) beep([MEL[i]], .2);
  if (BASS[i]) beep([BASS[i]], .25);
  if (n >= 5 && MEL[i] && i % 4 === 0) beep([MEL[i] * 1.25], .2);
  if (n >= 6) beep([ARP[i % 4] * 2], .08);
  if (n >= 8 && Math.random() < .5) beep([1500 + Math.random() * 1500], .06);
}
function openParty(){
  const list = FRIENDS.filter(isUnlocked), n = list.length, p = $("party"), grid = $("pgrid"), all = FRIENDS.length;
  grid.innerHTML = "";
  list.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "dancer"; d.dataset.e = f.e;
    d.innerHTML = '<span>' + f.e + '</span><div class="fbub"></div>';
    d.style.animationDelay = (-i * .17) + "s"; grid.appendChild(d);
  });
  const k = partyLvl = Math.round((n - STARTERS.length) / (all - STARTERS.length) * 5);
  p.style.setProperty("--dsz", n > 12 ? "40px" : n > 8 ? "50px" : "62px");
  p.style.setProperty("--dance", Math.max(.22, .6 - k * .08) + "s");
  p.style.setProperty("--spin", Math.max(2.5, 9 - k * 1.3) + "s");
  p.style.setProperty("--bgs", Math.max(2, 6 - k * .8) + "s");
  p.classList.toggle("crazy", k >= 4);
  $("partyNote").innerHTML = "💡 המסיבה משתפרת עם כל חבר חדש! יותר חברים = יותר ריקודים, אורות ומוזיקה.<br>" +
    "רמת הפראות: " + "🔥".repeat(k + 1) + "⚪".repeat(5 - k) + (n < all ? "<br>עוד " + (all - n) + (all - n === 1 ? " חבר מחכה" : " חברים מחכים") + " בעולמות" : "<br>🎊 כל החברים כאן - זו המסיבה הכי פרועה!");
  p.querySelectorAll(".note").forEach(x => x.remove());
  for (let i = 0; i < 8 + Math.min(n, 10) * 3; i++){
    const e = document.createElement("div"); e.className = "note"; e.textContent = ["🎵", "🎶", "✨", "🎈"][i % 4];
    e.style.left = (Math.random() * 94) + "%"; e.style.animationDelay = (-Math.random() * 5) + "s"; e.style.animationDuration = Math.max(2.2, 7 - k * .8 + Math.random() * 2) + "s";
    p.appendChild(e);
  }
  p.classList.remove("hidden");
  partyStep = 0; clearInterval(partyTimer); partyTimer = setInterval(partyTick, 250 - k * 24);
  clearInterval(partyFx); if (k >= 1) partyFx = setInterval(() => confetti(20 + k * 12), Math.max(700, 3200 - k * 450));
  confetti(150);
  clearInterval(partyMoveT); clearInterval(partySayT);
  const T = Math.max(600, 2400 - k * 380), dancers = [...grid.children];
  setTimeout(() => {
    dancers.forEach(d => { const b = d.getBoundingClientRect(); d._home = { l: b.left, r: b.right, t: b.top, b: b.bottom }; d.style.transition = "translate " + T * .9 + "ms ease-in-out, rotate " + T * .9 + "ms ease-in-out"; });
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const move = () => dancers.forEach(d => {
      const h = d._home, R = 30 + k * 55;
      d.style.translate = clamp((Math.random() * 2 - 1) * R, 8 - h.l, innerWidth - 8 - h.r) + "px " + clamp((Math.random() * 2 - 1) * R, 80 - h.t, innerHeight - 8 - h.b) + "px";
      d.style.rotate = k >= 2 ? ((Math.random() * 2 - 1) * k * 12) + "deg" : "0deg";
    });
    move(); partyMoveT = setInterval(move, T);
  }, 120);
  const sayOne = () => {
    dancers.forEach(x => x.classList.remove("say"));
    const d = pick(dancers), lines = SAYS[d.dataset.e] || ["🎉"], fb = d.querySelector(".fbub");
    fb.textContent = pick(lines); fb.classList.remove("below"); fb.style.marginLeft = "0";
    d.classList.add("say");
    const r = fb.getBoundingClientRect();
    if (r.top < 70) fb.classList.add("below");
    const shift = r.left < 6 ? 6 - r.left : r.right > innerWidth - 6 ? innerWidth - 6 - r.right : 0;
    fb.style.marginLeft = shift + "px";
    setTimeout(() => d.classList.remove("say"), 2300);
  };
  sayOne(); partySayT = setInterval(sayOne, Math.max(2000, 3000 - k * 150));
}
function closeParty(){
  clearInterval(partyTimer); clearInterval(partyFx); clearInterval(partyMoveT); clearInterval(partySayT);
  partyTimer = partyFx = partyMoveT = partySayT = null; $("party").classList.add("hidden");
}

{
